# Hurricane Beryl — observation-vs-observation validation.

storm_name: Hurricane Beryl
best_track: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/bdeck/bal022024.dat

# pull from relevant hafs and wofs runs
valid_start: 2024070512
valid_end: 2024071103

# Wide field domain for the map panels; the best track is drawn on every map.
domain: [22.0, 47.0, -105.0, -67.5]

out_dir:          /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/grid-tests/2024-02l-beryl/
mrms_cache_dir:   /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/mrms/
stage4_cache_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/stage-iv/
aorc_cache_dir:   /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/aorc/

# MRMS is already cached from the model-verification runs; flip to false
# once you also want it in the 3-way hourly comparison.
skip_mrms: false
skip_stage4: false
skip_aorc: false

# Model cycles to pull and verify. Independent of the scoring window above:
# init_start may sit days before valid_start to reach long lead times, while
# the statistics -- and the verification grid -- still cover valid_start to
# valid_end only. init_end defaults to valid_end, since a cycle initialized
# after the window ends scores nothing.
# init_start: 2024070500
# init_end:   2024071000

# WoFS domain for this case, used as a statistics mask (not as the grid) so
# HAFS can still be scored outside it. Omit for cases with no WoFS run.
# wofs_domain: [31.5, 39.5, -87.0, -78.0]

# Common verification grid: Lambert conformal at a constant km spacing, built
# from the best track inside the valid window. All values below are defaults.
#   pad_km          how far the GRID extends past the trimmed track
#   mask_radius_km  how far the STATISTICS swath extends from the track
# pad_km is the larger of the two on purpose: a forecast initialized days out
# can be several hundred km off track, and rain falling outside the grid is
# silently uncounted -- which loses false alarms while keeping misses.
# verification_grid:
#   res_km: 6.0
#   pad_km: 750.0
#   mask_radius_km: 500.0
#   margin_h: 6          # track points kept either side of the valid window
#   max_cells: 800       # build aborts above this in Nx or Ny
#   # std_parallels: [20, 45]
#   # domain_override: [lat_min, lat_max, lon_min, lon_max]

# MET regridding (regrid-obs). Each obs hour is regridded once onto the grid
# of grid_template -- any GRIB file on the target grid; the first glob match
# is used and its grid copied into cache_dir. Needs `module load met/12.2.0`.
regrid:
  grid_template:  /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/hafs/2024-02l/HFSA/2024070518/02l.2024070518.hfsa.parent.atm.f000.grb2
  grid_name: hafs_parent
  cache_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/regrid_obs/2024-02l-beryl/
  method: BUDGET
  width: 2
  vld_thresh: 0.5
  tolerance_pct: 2.0
  # Per-source MET field strings, only if a default doesn't match your files:
  # fields:
  #   mrms: 'name="MultiSensor_QPE_01H_Pass2"; level="Z0";'

# Maps of the regridded obs (plot-regrid). Subfolders compare-regrid/,
# compare-products/, compare-anomaly/ are created under out_dir.
# zoom_domain is [lat_min, lat_max, lon_min, lon_max] for the extra
# native-vs-regridded close-up; delete it to skip the zoom maps.
regrid_plots:
  out_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/obs-verification/2024-02l-beryl/
  zoom_domain: [34.0, 35.0, -83.0, -81.0]
