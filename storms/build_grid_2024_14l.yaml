# Milton (AL14 2024) -- verification-grid construction (analysis step A2).
#
#   python analysis/run.py storms/build_grid_2024_14l.yaml build-grid
#
# Writes <out_dir>/build_grid_2024_14l_grid.json (Lambert parameters + the MET grid
# spec) and a sanity map of the grid, best track by ATCF status, statistics
# swath, and WoFS box.

storm_name: Milton
best_track: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/bdeck/bal142024.dat

# TODO: narrow to the verification window. These are the full b-deck extent,
# which draws the whole track so the landfall window can be chosen from the
# map; the grid is built from the track INSIDE this window, so leaving it wide
# makes the grid far larger than it needs to be.
valid_start: 2024100912
valid_end:   2024101012

# TODO (optional): model cycles to pull, independent of the scoring window.
# init_start may sit days before valid_start to reach long lead times; the grid
# still follows the valid window. init_end defaults to valid_end.
init_start: 2024100618
init_end:   2024101006

# TODO (optional): WoFS deployments for this case, estimated from the example
# plots. WoFS is re-sited between events, so list one entry per deployment
# with the period it was running. The grid takes the union of them; each stays
# a separate statistics mask applied only inside its own window, so a box that
# was live on day 1 never masks day-3 statistics. Omit for cases with no WoFS.
# valid_start/valid_end are optional -- leave them out for an always-on box.
wofs_domains:
  - name: wofs_1
    domain: [24.3, 32.4, -87.2, -78.0]
    valid_start: 2024100917
    valid_end:   2024101012

# Wide lat/lon box for map panels only; the grid geometry is derived from the
# track, not from this.
domain: [17, 33, -99, -62]

out_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/grids/

# Observations. Stage IV is the truth product for this study: the MRMS archive
# on noaa-mrms-pds only reaches back to 2020-10-14, which excludes half the
# case list. MRMS stays available as a post-2020 sensitivity check.
truth_source: stage4
stage4_cache_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/stage-iv/

# Regrid the truth product onto this case's verification grid (regrid-obs).
# grid_json is the file written by build-grid above, so the MET grid spec is
# never retyped. Only truth_source is regridded; add `sources: [stage4, mrms]`
# here to regrid more. Needs `module load met/12.2.0`.
regrid:
  grid_json: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/grids/build_grid_2024_14l_grid.json
  cache_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/stage-iv-regrid/2024-14l/
  method: BUDGET
  width: 2
  vld_thresh: 0.5
  tolerance_pct: 2.0

verification_grid:
  res_km: 6.0
  pad_km: 750.0          # how far the GRID extends past the trimmed track
  mask_radius_km: 500.0  # how far the STATISTICS swath extends
  margin_h: 6
  # Loosened from the 800 default so the whole-track view renders before the
  # window is narrowed. Drop it back to 800 once valid_start/valid_end are set.
  max_cells: 1500
