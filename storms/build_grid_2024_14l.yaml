# Milton (AL14 2024) -- verification-grid construction (analysis step A2).
#
#   python analysis/run.py storms/build_grid_2024_14l.yaml build-grid
#
# Writes <out_dir>/build_grid_2024_14l_grid.json (Lambert parameters + the MET grid
# spec) and a sanity map of the grid, best track by ATCF status, statistics
# swath, and WoFS box.

storm_name: Milton
best_track: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/bdeck/bal142024.dat

# TODO: narrow to the verification window. These are the full b-deck extent,
# which draws the whole track so the landfall window can be chosen from the
# map; the grid is built from the track INSIDE this window, so leaving it wide
# makes the grid far larger than it needs to be.
valid_start: 2024100912
valid_end:   2024101012

# TODO (optional): model cycles to pull, independent of the scoring window.
# init_start may sit days before valid_start to reach long lead times; the grid
# still follows the valid window. init_end defaults to valid_end.
init_start: 2024100618
init_end:   2024101006

# TODO (optional): WoFS deployments for this case, estimated from the example
# plots. WoFS is re-sited between events, so list one entry per deployment
# with the period it was running. The grid takes the union of them; each stays
# a separate statistics mask applied only inside its own window, so a box that
# was live on day 1 never masks day-3 statistics. Omit for cases with no WoFS.
# valid_start/valid_end are optional -- leave them out for an always-on box.
wofs_domains:
  - name: wofs_1
    domain: [24.3, 32.4, -87.2, -78.0]
    valid_start: 2024100917
    valid_end:   2024101012

# Wide lat/lon box for map panels only; the grid geometry is derived from the
# track, not from this.
domain: [17, 33, -99, -62]

out_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/grids/

# Observations. Stage IV is the truth product for this study: the MRMS archive
# on noaa-mrms-pds only reaches back to 2020-10-14, which excludes half the
# case list. MRMS stays available as a post-2020 sensitivity check.
truth_source: stage4
stage4_cache_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/stage-iv/

# Regrid the truth product onto this case's verification grid (regrid-obs).
# grid_json is the file written by build-grid above, so the MET grid spec is
# never retyped. Only truth_source is regridded; add `sources: [stage4, mrms]`
# here to regrid more. Needs `module load met/12.2.0`.
regrid:
  grid_json: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/grids/build_grid_2024_14l_grid.json
  cache_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/stage-iv-regrid/2024-14l/
  method: BUDGET
  width: 2
  vld_thresh: 0.5
  tolerance_pct: 2.0

# HAFS source files for this case (regrid-hafs, analysis steps D3+D4). The 3 h
# APCP bucket is read straight out of the parent files -- no intermediate
# extraction -- and written on the verification grid from the `regrid:` block
# above. root is searched recursively, so it can point at the case directory
# and the per-cycle subdirectories are found automatically. storm_id keeps a
# multistorm run from pulling the wrong cyclone.
hafs:
  root: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/hafs/2024-14l/
  cache_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/data/hafs-regrid/2024-14l/
  model: hfsa
  storm_id: 14l
  # field_spec: 'name="APCP"; level="A3";'   # the 3 h bucket, NOT the run total
  # cycle_h: 6
  # max_lead_h: 126
  # budget_check: true    # false skips the mass check and the native-file read
  # tolerance_pct: 2.0

# Stage IV vs HAFS panels for eyeballing (plot-hafs, analysis step D5b). One
# figure per 3 h window per cycle, zoomed to the WoFS deployment nearest in
# time to that window; with no wofs_domains it falls back to the whole grid.
hafs_plots:
  out_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/regrid-stage-iv-hafs/2024-14l/
  # init_hours: [0]       # cycles to draw; [0, 12] doubles the figure count

# Maps of the regridded obs (plot-regrid). Only the regridded products are
# plotted, so with truth_source alone this gives the Stage IV native-vs-
# regridded panels in both the wide and zoom views, written straight into
# out_dir; compare-products and compare-anomaly need a second product, are
# skipped automatically, and get their own subfolders when they do run.
# `panels:` restricts the output -- drop it for everything available.
regrid_plots:
  out_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/regrid-stage-iv-plots/2024-14l/
  panels: [compare-regrid]
  # zoom_domain is [lat_min, lat_max, lon_min, lon_max] for the close-up that
  # shows small-scale changes the wide view cannot. Pick a box over the
  # heaviest rain; delete it to skip the zoom maps.
  zoom_domain: [27, 28, -82.5, -81.5]

# Observation-validity mask (build-masks). Stage IV covers US land and thins
# out offshore, so this marks where there is truth to verify against: US land
# plus coast_buffer_km of water beyond it, with foreign land excluded (a
# buffer around US land would otherwise sweep in Mexico, Cuba and the
# Bahamas, which Stage IV never observes). Distance is measured to land, not
# to a named coastline, so the Atlantic, Gulf and Pacific coasts all come out
# of the same transform. Written to out_dir beside the grid.
masks:
  coast_buffer_km: 150.0
  out_dir: /work2/noaa/aoml-hafs1/emurray/ppgc-hafs/figures/masks/correct/
  # ne_scale: 50m        # Natural Earth resolution for the land polygons

verification_grid:
  res_km: 6.0
  pad_km: 750.0          # how far the GRID extends past the trimmed track
  mask_radius_km: 500.0  # how far the STATISTICS swath extends
  margin_h: 6
  # Loosened from the 800 default so the whole-track view renders before the
  # window is narrowed. Drop it back to 800 once valid_start/valid_end are set.
  max_cells: 1500
